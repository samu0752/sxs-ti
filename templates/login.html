{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="login-panel">
  <div class="brand login-brand"><span class="brand-mark" aria-hidden="true">SXS</span><span>SXS <strong>TI</strong><small>Central de chamados</small></span></div>
  <h1>Entrar na central</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Usuário ou e-mail<input name="identifier" autocomplete="username" maxlength="120" required></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
    <button class="button primary">Entrar</button>
  </form>
  <p class="panel-separator">Primeiro acesso? <a class="text-link" href="{{ url_for('register') }}">Criar conta</a></p>
</section>
{% endblock %}
