name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy --python-version 3.11 app.py sxs_core.py scripts
      - run: python -m bandit app.py sxs_core.py -r scripts
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ matrix.python }}
          path: coverage.xml
      - run: python -m pip_audit
      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.11' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
