services:
  - type: web
    name: central-chamados-ti-samuel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: DEMO_READ_ONLY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_RENDER_PROXY
        value: "1"
      - key: LOAD_SAMPLE_DATA
        value: "1"
      - key: SECRET_KEY
        generateValue: true
